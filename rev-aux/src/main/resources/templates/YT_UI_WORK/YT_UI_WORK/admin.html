<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head th:replace="~{YT_UI_WORK/YT_UI_WORK/fragment :: css-and-scripts}"></head>
<body id="kt_app_body" data-kt-app-layout="light-sidebar" data-kt-app-header-fixed="true" data-kt-app-sidebar-enabled="true" data-kt-app-sidebar-fixed="true" data-kt-app-sidebar-hoverable="true" data-kt-app-sidebar-push-header="true" data-kt-app-sidebar-push-toolbar="true" data-kt-app-sidebar-push-footer="true" data-kt-app-toolbar-enabled="true" class="app-default">
    <!-- Include Header and Sidebar -->
	<div th:replace="~{YT_UI_WORK/YT_UI_WORK/fragment :: fullContent}"></div>



    <!-- Main Content -->
    <div id="tab-content" th:fragment="admin-content" style="display: none;">
        <div class="tab-pane active" id="admin">

            <ul class="nav flex-wrap border-transparent fw-bold" style="padding: 0px!important; margin: 0px!important;" id="admin_section_tabs">
                <!-- Nav items for tabs -->
                <li class="admin_nav-item my-1">
                    <button class="btn btn-color-gray-600 btn-active-secondary btn-active-color-primary fw-bolder fs-8 fs-lg-base nav-link px-3 px-lg-8 mx-1 active" data-tab="employee_list">
                        Employee List
                    </button>
                </li>
                <li class="admin_nav-item my-1">
                    <button class="btn btn-color-gray-600 btn-active-secondary btn-active-color-primary fw-bolder fs-8 fs-lg-base nav-link px-3 px-lg-8 mx-1" data-tab="role_setting">
                        Role Setting
                    </button>
                </li>
                <li class="admin_nav-item my-1">
                    <button class="btn btn-color-gray-600 btn-active-secondary btn-active-color-primary fw-bolder fs-8 fs-lg-base nav-link px-3 px-lg-8 mx-1" data-tab="assign_permission">
                        Assign Permission
                    </button>
                </li>
            </ul>

            <div id="admin_section_tab-content">
                <!-- Employee List Tab Content -->
                <div class="admin_section_tab-pane active" id="employee_list">
                    <div class="d-flex flex-wrap align-items-center justify-content-between" style="height: 120px;">
                        <div class="d-flex mb-2 mb-md-0 flex-grow-1 me-3">
                            <div id="search-wrapper" class="d-flex align-items-center w-100" style="max-width: 500px;">
                                <i class="search-icon fas fa-search me-2"></i>
                                <input type="text" id="search" placeholder="Search" class="form-control form-control-sm w-100"/>
                            </div>
                        </div>
                        <button style="background: #FF7020;" type="submit" class="btn btn-sm btn-primary" data-kt-menu-dismiss="true" data-bs-toggle="modal" data-bs-target="#addEmployeeModal">
                            Add Employee
                        </button>
                    </div>
                    <div style="overflow-x: auto;">
                        <table class="table table-bordered table-hover text-center" style="min-width: 1500px;">
                            <thead class="text-white" style="background-color: #2e2a6c;">
                                <tr>
                                    <th scope="col" rowspan="2"><input type="checkbox"></th>
                                    <th scope="col" rowspan="2" style="color: white">Name</th>
                                    <th scope="col" rowspan="2" style="color: white">UserName</th>
                                    <th scope="col" rowspan="2" style="color: white">Password</th>
                                    <th scope="col" rowspan="2" style="color: white">Phone</th>
                                    <th scope="col" rowspan="2" style="color: white">Email</th>
                                    <th scope="col" rowspan="2" style="color: white">City</th>
                                    <th scope="col" rowspan="2" style="color: white">Zip</th>
                                    <th scope="col" rowspan="2" style="color: white">Is Admin</th>
                                    <th scope="col" rowspan="2" style="color: white">Role</th>
                                    <th scope="col" rowspan="2" style="color: white">Account Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><input type="checkbox"></td>
                                    <td>1</td>
                                    <td>PN12345</td>
                                    <td>Widget A</td>
                                    <td>1234567890</td>
                                    <td>ABS</td>
                                    <td>4</td>
                                    <td>Cold</td>
                                    <td>Edge</td>
                                    <td>Steel A</td>
                                    <td>
                                        <a href="#" class="btn btn-icon btn-active-color-primary btn-sm me-1" data-bs-toggle="modal" data-bs-target="#editEmployeeModal">
                                            <img src="assets/acount_action_1.svg" alt="Switch Icon" class="img-fluid" style="width: 24px; height: 24px;">
                                        </a>
                                        <a href="#" class="btn btn-icon btn-active-color-primary btn-sm me-1" data-bs-toggle="modal" data-bs-target="#deleteConfirmationModal">
                                            <img src="assets/acount_action_2.svg" alt="Switch Icon" class="img-fluid" style="width: 24px; height: 24px;">
                                        </a>
                                        <a href="#" class="btn btn-icon btn-active-color-primary btn-sm me-1" data-bs-toggle="modal" data-bs-target="#changePasswordModal">
                                            <img src="assets/acount_action_3.svg" alt="Switch Icon" class="img-fluid" style="width: 24px; height: 24px;">
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Role Setting Tab Content -->
                <div class="admin_section_tab-pane" id="role_setting">
                    <div style="background-color: transparent; padding: 20px; margin-bottom: 20px;">
                        <div class="d-flex align-items-center">
                            <label for="add-role" style="margin-right: 10px;">Add Role</label>
                            <input type="text" id="add-role" class="form-control" placeholder="Enter Role" style="margin-right: 10px; width: 200px;">
                            <button class="btn btn-warning" style="background-color: #FF7020; border: none;">Save</button>
                        </div>
                    </div>
                    <table class="table table-bordered" style="margin: 0; width: 250px;">
                        <thead style="background-color: #241D75; color: white;">
                            <tr>
                                <th style="text-align: center; width: 25%; color: white!important;">Sr No.</th>
                                <th style="text-align: center;color: white!important;">Roles List</th>
                            </tr>
                        </thead>
                        <tbody style="background-color: white; color: black;">
                            <tr><td style="text-align: center;">1</td><td>Tooling Supervisor</td></tr>
                            <tr><td style="text-align: center;">2</td><td>Sales Person</td></tr>
                            <tr><td style="text-align: center;">3</td><td>Senior Sales Person</td></tr>
                            <tr><td style="text-align: center;">4</td><td>Role - 1</td></tr>
                            <tr><td style="text-align: center;">5</td><td>Role - 2</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- Assign Permission Tab Content -->
                <div class="admin_section_tab-pane" id="assign_permission">
                    <div class="container-fluid mt-5" style="padding-right: 0px!important; padding-left: 0px!important; margin-left: 0px!important; margin-right: 0px!important;">
                        <!-- Role Selection -->
                        <div class="d-flex align-items-center mb-3">
                            <select id="role-select" style="width: 400px!important; margin-left: 100px;" class="form-select w-auto">
                                <option selected disabled>Select Role</option>
                                <option value="admin">Admin</option>
                                <option value="user">User</option>
                                <option value="manager">Manager</option>
                            </select>
                            <button style="background-color: #FF7020" class="btn btn-warning ms-3">Save</button>
                        </div>

                        <!-- Modules and Menu Assignment -->
                        <div class="p-3" style="background-color: #241D75; color: white; border-radius: 5px; padding-right: 0px!important; padding-left: 0px!important; margin-left: 0px!important; margin-right: 0px!important;">
                            <h3 class="mb-0 text-center text-uppercase" style="color: white!important;">Modules and Menu Assign</h3>
                        </div>
                        <div class="row mt-3" style="margin-left: -1px; margin-right: -1px;">
                            <!-- Individual module section (Admin, Dashboard, Procurement, etc.) goes here -->
                            <!-- Each module section should be treated like the Admin, Dashboard, Procurement, etc. sections -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Include Footer -->
   

    <!-- Include Scripts -->
	<div th:replace="~{YT_UI_WORK/YT_UI_WORK/fragment :: scripts}"></div>
	
	<script>
	    document.addEventListener("DOMContentLoaded", function () {
	        const adminContent = document.getElementById("tab-content");
	        if (adminContent) {
	            adminContent.style.display = "block";
	        }
	    });
	</script>
	
	<script>
		
	    document.addEventListener('DOMContentLoaded', () => {
	        // Fetch RFQ data from the backend API
	        fetch('/app/rfq_api/getRFQdata?rfqID=NT1947&UID=Admin')
	            .then(response => response.json())
	            .then(data => {
	                // Display the fetched data in an alert
	                alert('RFQ Data: ' + JSON.stringify(data));
	            })
	            .catch(error => {
	                console.error('Error fetching RFQ data:', error);
	                alert('Failed to load RFQ data.');
	            });
	    });
	</script>

	
</body>
</html>
