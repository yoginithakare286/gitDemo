<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
   <!--  <base href="../../../"/> -->
    <!-- Base tag to handle context root -->
   <base href="@{/rev-aux/}">
    <title>YT SOLUTIONS - Login</title>
    <meta charset="utf-8"/>
    <meta name="description" content="YT Solutions"/>
    <meta name="keywords" content="yt solutions"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta property="og:locale" content="en_US"/>
    <meta property="og:type" content="article"/>
    <meta property="og:title" content="YT Solutions"/>
    <meta property="og:url" content="https://www.google.com/"/>
    <meta property="og:site_name" content="YT SOLUTIONS"/>
    <link rel="canonical" href="https://www.google.com/"/>
    <link rel="shortcut icon" href="assets/media/logos/favicon.ico"/>

    <!-- Fonts (Required) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700"/>

    <!-- Global Stylesheets Bundle (Required) -->
    <link href="/rev-aux/assets/plugins/global/plugins.bundle.css" rel="stylesheet" type="text/css"/>
    <link href="/rev-aux/assets/css/style.bundle.css" rel="stylesheet" type="text/css"/>

    <!-- Prevent Click-jacking -->
    <script>
        if (window.top !== window.self) { window.top.location.replace(window.self.location.href); }
    </script>
	
	<script th:inline="javascript">
	    var CONTEXT_ROOT = /*[[@{/}]]*/ '';
	    console.log("🌐 CONTEXT_ROOT =", CONTEXT_ROOT);
	</script>


	
</head>

<body id="kt_body" class="app-blank">
<div class="d-flex flex-column flex-root" id="kt_app_root">
    <div class="d-flex flex-column flex-lg-row flex-column-fluid">
        <!-- Logo -->
        <a href="/" class="d-block d-lg-none mx-auto py-20">
            <img src="/rev-aux/assets/media/logos/yt_logo.png" style="width: 100px; height: 100px;" alt="Logo">
        </a>

        <!-- Background Image -->
        <div class="d-none d-lg-flex flex-lg-row-fluid w-50" style="background-image: url(/rev-aux/assets/media/auth/signin_ss.png)"></div>

        <!-- Sign-in Form -->
        <div class="d-flex flex-column flex-column-fluid flex-center w-lg-50 p-10">
            <div class="d-flex justify-content-between flex-column-fluid flex-column w-100 mw-450px">
                <div class="text-center mb-20">
                    <img src="/rev-aux/assets/cubix_logo.png" style="width: 300px; height: 100px;" alt="Logo">
                </div>

                <!-- Login Form -->
                <form class="form w-100" id="loginForm">
                    <div class="fv-row mb-8">
                        <label class="fs-5 fw-semibold mb-2">Username / Email</label>
                        <input type="text" id="username" name="username" class="form-control fs-4 py-4 text-gray-700" required>
                    </div>

                    <div class="fv-row mb-3">
                        <label class="fs-5 fw-semibold mb-2">Password</label>
                        <input type="password" id="password" name="password" class="form-control fs-4 py-4 text-gray-700" required>
                    </div>

                    <!-- Error Message Display -->
                    <div id="errorMessage" class="text-danger text-center mb-4" style="display: none;"></div>

                    <div class="d-grid mb-10">
                        <button type="submit" id="loginButton" class="btn btn-primary" style="background-color: #231D70">
                            LOGIN
                        </button>
                    </div>
                </form>

                <!-- Forgot Password Link (Optional) -->
                <div class="text-center">
                    <a href="/forgot-password" class="link-primary"></a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Global JavaScript Bundle (Required) -->
<script src="/rev-aux/assets/plugins/global/plugins.bundle.js"></script>
<script src="/rev-aux/assets/js/scripts.bundle.js"></script>


<script>
	document.getElementById("loginForm").addEventListener("submit", async function (event) {
	    event.preventDefault();

	    const username = document.getElementById("username").value;
	    const password = document.getElementById("password").value;

	    try {
	        const response = await fetch(CONTEXT_ROOT+"auth/login", {
	            method: "POST",
	            headers: { "Content-Type": "application/x-www-form-urlencoded" },
	            body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`,
	            credentials: "include" // ✅ Important: Ensures cookies are sent and received
	        });

	        if (!response.ok) {
	            throw new Error("Invalid username or password");
	        }

	        console.log("✅ Login successful, JWT stored in cookie!");

	        // ✅ Redirect to admin page
	        window.location.href = CONTEXT_ROOT+"admin";
	    } catch (error) {
	        console.error("❌ Login failed:", error.message);
	        alert("Login failed. Please try again.");
	    }
	});




</script>



</body>
</html>
