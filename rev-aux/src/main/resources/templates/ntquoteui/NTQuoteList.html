	<script>

	$(document).ready(function () {

	$('#nt-quote-menu').on('click', function () {

	const tableBody = $("#tableBody");

	tableBody.empty();



	$.ajax({

	//url: '/rev-aux/api/ntQuotes/nt-quotes-data',

	url: CONTEXT_ROOT + 'api/ntQuotes/nt-quotes-data', // Uses Thymeleaf variable dynamically



	type: 'GET',

	beforeSend: function (request) {

	let token = localStorage.getItem('token');

	request.setRequestHeader("Authorization", token);

	},

	success: function (response) {

	populateTable(response);

	populateDropdownFilters(response);

	},

	error: function (xhr, status, error) {

	console.error('Error fetching data:', error);

	}

	});

	});



	function populateTable(data) {
	//alert("data = " + data);
	const tableBody = $("#tableBody");

	tableBody.empty();



	data.forEach((quote, index) => {

	let rfqNoLink = quote.rfqDetail?.id 

	? `<a href="/rev-aux/ntQuoteDetailedScreen?id=${quote.rfqDetail.id}" 

	style="color: #0075FF; text-decoration: underline;">

	${quote.rfqDetail.rfqId}

	</a>`

	: (quote.rfqDetail?.rfqId || '');



	// Handle multiple mold manual files

	let moldManualLinks = '';

	if (quote.moldManual && quote.moldManual.trim() !== '') {

	let filePaths = quote.moldManual.replace(/[\{\}"]/g, '').split(',');

	let validFilePaths = filePaths.filter(path => path.trim() !== '');



	if (validFilePaths.length > 0) {
	    moldManualLinks = `
	        <div style="text-align: center;">
	            <a href="#" class="upload-mold-mannual" style="color:#0075FF;">
	                <img src="assets/paperclip%201.svg"> Attach
	            </a>
	        </div>
	        <div style="text-align: left;">`;

	    validFilePaths.forEach((filePath) => {
	        let fileName = filePath.trim().split('/').pop();
	        moldManualLinks += `
	            <div class="file-row">
	                <a href="#" class="mold-manual-file-link" data-filepath="${encodeURIComponent(filePath.trim())}">
	                    ${fileName}
	                </a>
	                <a href="#" class="delete-mold-manual-file" data-filepath="${encodeURIComponent(filePath.trim())}">
	                    &#10006;
	                </a>
	            </div>`;
	    });

	    moldManualLinks += `</div>`;
	}


	}



	// If no files exist, show only attach option

	if (!moldManualLinks) {

	moldManualLinks = `<div style="text-align: center;">

	<a href="#" class="upload-mold-mannual" style="color:#0075FF;">

	<img src="assets/paperclip%201.svg"> Attach 

	</a>

	</div>`;

	}



	let row = `

	<tr class="ntListData">

	<td><input type="checkbox"></td>

	<td>${index + 1}</td>	

	<td>${quote.salesPerson}</td>

	<td>${quote.customerName}</td>

	<td>${quote.quoteNumber}</td>

	<td>${rfqNoLink}</td>

	<td>${quote.status}</td>

	<td>${quote.moldNumber}</td>

	<td>${quote.partNumber}</td>

	<td>${quote.dueDate}</td>

	<td class="mold-manual-cell">${moldManualLinks}</td>

	<td><a href="${quote.customerPo}" target="_blank">View</a></td>

	<td><a href="${quote.vendorQuote}" target="_blank">View</a></td>

	<td><a href="${quote.vendorPo}" target="_blank">View</a></td>

	<td><a href="${quote.cadFile}" target="_blank">${quote.cadFile}</a></td>

	<td>$ ${(quote.quotedPrice || 0).toLocaleString()}</td>


	<td>${quote.deliveryTime}</td>

	<td>${quote.quoteDate}</td>

	<td  class="hidden">${quote.id}</td>

	</tr>`;

	tableBody.append(row);

	});

	}

	$(document).ready(function () {
	    // Reference to the main header checkbox
	    let mainCheckbox = $("#ntQuotesTable thead tr:first-child th input[type='checkbox']");

	    // Event: Clicking the header checkbox selects/deselects all row checkboxes
	    mainCheckbox.on("change", function () {
	        let isChecked = $(this).prop("checked");
	        $("#tableBody tr input[type='checkbox']").prop("checked", isChecked);
	    });

	    // Event: Clicking any row checkbox
	    $("#tableBody").on("change", "tr input[type='checkbox']", function () {
	        let totalCheckboxes = $("#tableBody tr input[type='checkbox']").length;
	        let checkedCheckboxes = $("#tableBody tr input[type='checkbox']:checked").length;

	        // If all are checked, check the main checkbox; otherwise, uncheck it
	        mainCheckbox.prop("checked", totalCheckboxes === checkedCheckboxes);
	    });
	});

	
	function populateDropdownFilters(data) {
	    console.log("Populating dropdown filters with data:", data);

	    const allowedColumns = [2, 3, 4,5, 6, 7, 8, 9, 15, 16, 17]; // Columns that need filtering

	    allowedColumns.forEach((colIndex) => {
	        let uniqueValues = new Set();

	        data.forEach(item => {
	            let columnValue = [
	                item.salesPerson, item.customerName, item.quoteNumber, item.rfqDetail?.rfqId, item.status,
	                item.moldNumber, item.partNumber, item.dueDate, item.quotedPrice,
	                item.deliveryTime, item.quoteDate
	            ][allowedColumns.indexOf(colIndex)];

	            if (columnValue) uniqueValues.add(columnValue);
	        });

	        let filterCell = $(`thead tr:eq(1) th:eq(${colIndex})`);
	        filterCell.html(createInputWithDropdown([...uniqueValues], colIndex));
	    });

	    // Event listener to show dropdown below the input box
	    $(".filter-input").on("focus", function () {
	        let dropdown = $(this).siblings(".dropdown-list");
	        dropdown.css({
				display: "block",
				           top: $(this).outerHeight() + "px", // Position below the input box
				           left: "0",
				           width: "190.109px", // Fixed width
				           height: "150px", // Fixed height
				           position: "absolute",
				           "z-index": 1000, // Ensure it appears above other elements
				           "background-color": "#fff",
				           border: "1px solid #ccc",
				           "overflow-y": "auto" // Enables scrolling
	        });
	    });

	    // Event listener for filtering dropdown values
	    $(".filter-input").on("input", function () {
	        let inputValue = $(this).val().toLowerCase();
	        let dropdownOptions = $(this).siblings(".dropdown-list").find("option");

	        dropdownOptions.each(function () {
	            let optionText = $(this).text().toLowerCase();
	            if (optionText.includes(inputValue)) {
	                $(this).show();
	            } else {
	                $(this).hide();
	            }
	        });
	    });

	    // Event listener to select value from dropdown
	    $(".dropdown-list").on("change", function () {
	        let selectedValue = $(this).val();
	        let inputField = $(this).siblings(".filter-input");

	        inputField.val(selectedValue);
	        $(this).hide();

	        // Trigger table filtering
	        let columnIndex = $(this).data("column");
	        filterTable(columnIndex, selectedValue);
	    });

	    // Hide dropdown when clicking outside
	    $(document).on("click", function (e) {
	        if (!$(e.target).closest(".dropdown-wrapper").length) {
	            $(".dropdown-list").hide();
	        }
	    });
	}

	// Function to create input box with dropdown
	function createInputWithDropdown(options, columnIndex) {
	    return `
	        <div class="dropdown-wrapper" style="position: relative; display: inline-block; width: 100%;">
	            <input type="text" class="filter-input" data-column="${columnIndex}" placeholder="Search..." style="width: 100%;">
	            <select class="dropdown-list" data-column="${columnIndex}" size="5" style="display: none; position: absolute; width: 100%;">
	                <option value="">Show All</option>
	                ${options.map(opt => `<option value="${opt}">${opt}</option>`).join("")}
	            </select>
	        </div>
	    `;
	}

	// Function to filter table
	function filterTable(columnIndex, filterValue) {
	    $("#tableBody tr").each(function () {
	        let cellText = $(this).find(`td:eq(${columnIndex})`).text().trim();
	        if (filterValue === "" || cellText === filterValue) {
	            $(this).show();
	        } else {
	            $(this).hide();
	        }
	    });
	}





	});

	</script>

	<script>

	

	
	

		$('#ntQuotesTable tbody').on('click', '.upload-mold-mannual', function(event) {
		    event.preventDefault();

		    var tr = $(this).closest('tr');
		    var rowData = [];

		    tr.find('td').each(function(index) {
		        rowData.push($(this).text().trim());
		    });

		    console.log("ntQuotesTable Row Data:", rowData);

		    var id = rowData[18];
		    var rfqNo = rowData[5];

		    // Create and trigger file input (allow all file types)
		    var fileInput = $('<input type="file" accept="*/*">').appendTo('body').hide();

		    fileInput.on('change', function(event) {
		        var files = event.target.files;
		        if (files.length > 0) {
		            var file = files[0];

		            // Check if file size exceeds 100MB (100 * 1024 * 1024 bytes)
		            if (file.size > 100 * 1024 * 1024) {
		                alert("File size is more than 100MB. Please upload a file that is 100MB or smaller.");
		                fileInput.remove(); // Remove the input to reset selection
		                return;
		            }

		            checkMoldMannualFileExists(id, file.name, function(exists) {
		                if (exists) {
		                    const overwrite = confirm(`The file ${file.name} already exists. Do you want to overwrite it?`);
		                    if (!overwrite) {
		                        return;
		                    }
		                    uploadMoldMannualFileWithOverwrite(id, file);
		                } else {
		                    uploadMoldMannualFile(id, file);
		                }
		            });
		        }
		        fileInput.remove();
		    });

		    fileInput.click();
		});



	

	<!-- Check file existence before uploading -->	

	function checkMoldMannualFileExists(id, fileName, callback) {

	//alert("check MoldMannual File Exists method id = " + id + " , fileName = " + fileName);

	$.ajax({

	// url: '/api/ntQuotes/checkMoldMannualFileExists',

	url: CONTEXT_ROOT + 'api/ntQuotes/checkMoldMannualFileExists',

	type: 'POST',

	data: { id: id, fileName: fileName },

	success: function(response) {

	callback(response.exists);

	},

	error: function(xhr) {

	console.error("Error checking mold mannual file existence:", xhr.responseText);

	callback(false);

	}

	});

	}

	

	// Upload file with overwrite option

	function uploadMoldMannualFileWithOverwrite(id, file) {

	var formData = new FormData();

	formData.append("files", file);

	formData.append("id", id);



	$.ajax({

	url: CONTEXT_ROOT + 'api/ntQuotes/overwriteMoldManualAttachment',

	type: 'POST',

	data: formData,

	processData: false,

	contentType: false,

	success: function() {

	console.log("File overwritten successfully!");

	alert("File overwritten successfully!");
	reloadTable();
	//window.location.reload();

	},

	error: function(xhr) {

	console.error("Error uploading file:", xhr.responseText);

	}

	});

	}





	//Upload file without overwrite

	function uploadMoldMannualFile(id, file) {

	var formData = new FormData();

	formData.append("files", file); // Use file, not fileName

	formData.append("id", id);



	$.ajax({

	url: CONTEXT_ROOT + 'api/ntQuotes/uploadMoldManualFile',

	type: 'POST',

	data: formData,

	processData: false,

	contentType: false,

	success: function() {

	console.log("File uploaded successfully!");

	alert("File uploaded successfully!");
	reloadTable();
	//window.location.reload();

	},

	error: function(xhr) {

	console.error("Error uploading file:", xhr.responseText);

	}

	});

	}

	


	

	</script>

<!--Download moldmanual file-->

	<script>

	$(document).on("click", ".mold-manual-file-link", function (event) {

	event.preventDefault();

	

	var tr = $(this).closest('tr');

	

	// Fetch specific values from the row

	var id = tr.find("td:nth-child(19)").text().trim(); // Adjust index if needed

	var filePath = $(this).data("filepath");



	if (!filePath) {

	console.error("Mold Manual File path is undefined or empty");

	return;

	}



	// Decode the file path to get the correct filename

	let decodedFilePath = decodeURIComponent(filePath); // Decode it first

	let fileName = decodedFilePath.split('/').pop(); // Extract filename from the decoded path



	// Re-encode properly before sending to the backend

	let encodedFilePath = encodeURIComponent(decodedFilePath);



	console.log("Row Data:", { id, filePath, decodedFilePath, fileName, encodedFilePath });



	// Create and trigger a download request

	var link = document.createElement("a");

	link.href = CONTEXT_ROOT + `api/ntQuotes/downloadMoldManualFile?id=${encodeURIComponent(id)}&filePath=${encodedFilePath}`;

	

	link.download = decodedFilePath.split('/').pop();

	document.body.appendChild(link);

	link.click();

	document.body.removeChild(link);

	

	});





	// Delete Mold Manual File
	$(document).on("click", ".delete-mold-manual-file", function (event) {
	    event.preventDefault();

	    var tr = $(this).closest('tr');

	    // Fetch specific values from the row
	    var id = tr.find("td:nth-child(19)").text().trim(); // Adjust index if needed
	    var filePath = $(this).siblings('.mold-manual-file-link').data("filepath"); // Get file path from sibling element

	    if (!filePath) {
	        console.error("Mold Manual File path is undefined or empty");
	        alert("Error: File path is undefined or empty.");
	        return;
	    }

	    // Decode and re-encode the file path properly
	    let decodedFilePath = decodeURIComponent(filePath);
	    let encodedFilePath = encodeURIComponent(decodedFilePath);

	    console.log("Row Data:", { id, filePath, decodedFilePath, encodedFilePath });

	    if (!confirm("Are you sure you want to delete this file?")) {
	        return;
	    }

	    // Prepare the request payload
	    var formData = {
	        id: id,
	        filePath: decodedFilePath
	    };

	    // AJAX request to delete the file
	
		$.ajax({
		    url: CONTEXT_ROOT + 'api/ntQuotes/deleteMoldManualFile',
		    type: 'POST',
		    data: JSON.stringify(formData),
		    contentType: 'application/json',
			success: function (response) {
			    console.log("Mold Manual File deleted successfully:", response);
			    alert("File deleted successfully!");

			    if (response.moldManual !== undefined) {
			        updateMoldManualColumn(tr, response.moldManual); // Update column with remaining files
			    } else {
			        console.warn("Warning: No moldManual data received in response. Fetching updated data...");
			        reloadSingleRow(tr); // Fetch updated row from the database
			    }
			},

		    error: function (xhr) {
		        console.error("Error deleting file:", xhr.responseText);
		        alert("Failed to delete the file.");
		    }
		});

	});


	</script>

	
	<script>
		function updateMoldManualColumn(row, moldManualData) {
		    let moldManualCell = row.find("td:nth-child(11)"); // Adjust column index as needed

		    let attachButton = `
		        <div style="text-align: center; margin-bottom: 5px;">
		            <a href="#" class="upload-mold-mannual" style="color:#0075FF;">
		                <img src="assets/paperclip%201.svg"> Attach
		            </a>
		        </div>
		    `;

		    if (!moldManualData || moldManualData.trim() === '' || moldManualData === '0') {
		        moldManualCell.html(attachButton); // No files left, show only Attach button
		        return;
		    }

		    let filePaths = moldManualData.replace(/[\{\}"]/g, '').split(','); // Remove brackets and split file names
		    let validFilePaths = filePaths.filter(path => path.trim() !== ''); // Remove empty values

		    if (validFilePaths.length === 0) {
		        moldManualCell.html(attachButton); // If no files left, show attach button only
		        return;
		    }

		    let moldManualLinks = '<div style="text-align: center;">';
		    validFilePaths.forEach((filePath) => {
		        let fileName = filePath.trim().split('/').pop();
		        moldManualLinks += `
		            <div style="display: flex; align-items: center; justify-content: center;">
		                <a href="#" class="mold-manual-file-link" 
		                   data-filepath="${encodeURIComponent(filePath.trim())}" 
		                   style="color:#0075FF;">
		                   ${fileName}

	<script>

	$(document).on("change", ".column-filter", function () {

	let filters = {}; // Store selected filter values

	

	$(".column-filter").each(function () {

	let columnIndex = $(this).data("column"); // Column index

	let selectedValue = $(this).val().toLowerCase(); // Selected value

	if (selectedValue) {

	filters[columnIndex] = selectedValue; // Store filter only if selected

	}

	});

	

	let visibleRows = 0; // Track number of matching rows

	

	$("#tableBody tr").each(function () {

	let row = $(this);

	let match = true; // Assume row matches

	

	for (let columnIndex in filters) {

	let cellText = row.find(`td:eq(${columnIndex})`).text().toLowerCase();

	if (!cellText.includes(filters[columnIndex])) {

	match = false; // Row does not match all filters

	break;

	}

	}

	

	if (match) {

	row.show();

	visibleRows++;

	} else {

	row.hide();

	}

	});

	

	// Show "No Data Found" if no rows are visible

	if (visibleRows === 0) {

	if ($("#noDataRow").length === 0) {

	$("#tableBody").append(`<tr id="noDataRow"><td colspan="18" style="text-align:center; color:red;">No Data Found</td></tr>`);

	}

	} else {

	$("#noDataRow").remove(); // Remove "No Data Found" message if data exists

	}

	});

	

	</script>

<script>

 document.getElementById('searchButton').addEventListener('click', function() {

 searchTable();

 });



 document.getElementById('ntSearch').addEventListener('keydown', function(event) {

 if (event.key === 'Enter') {

 event.preventDefault(); 

 searchTable();

 }

 });



 function searchTable() {

 const searchText = document.getElementById('ntSearch').value.toLowerCase();

 const tableBody = document.getElementById('tableBody');

 const rows = tableBody.getElementsByTagName('tr');

 let found = false; 



 if (searchText === "") {

 document.getElementById('noDataMessage').style.display = 'none';

 for (let i = 0; i < rows.length; i++) {

 rows[i].style.display = ''; // Show all rows

 }

 return; // Exit if no search text

 }



 document.getElementById('noDataMessage').style.display = 'none';



 for (let i = 0; i < rows.length; i++) {

 const row = rows[i];

 const cells = row.getElementsByTagName('td');

 let match = false;



 for (let j = 0; j < cells.length; j++) {

 const cellText = cells[j].textContent.toLowerCase();

 if (cellText.includes(searchText)) {

 match = true;

 break;

 }

 }



 if (match) {

 row.style.display = ''; 

 found = true;

 } else {

 row.style.display = 'none'; 

 }

 }



 if (!found) {

 document.getElementById('noDataMessage').textContent = "No data found matching your search.";

 document.getElementById('noDataMessage').style.display = 'block'; // Show the "No data" message

 }

 }



 document.getElementById('ntSearch').addEventListener('input', function() {

 const searchText = this.value.toLowerCase();

 const tableBody = document.getElementById('tableBody');

 const rows = tableBody.getElementsByTagName('tr');

 

 if (searchText === "") {

 // If search input is empty, show all rows and hide the no data message

 document.getElementById('noDataMessage').style.display = 'none';

 for (let i = 0; i < rows.length; i++) {

 rows[i].style.display = ''; // Show all rows

 }

 }

 });

	

</script>
